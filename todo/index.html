  // Switch to board so edit panel is usable, or keep calendar and show a mini modal.
  // Spec: click block opens existing edit UI — use board temporarily if needed.
  if(uiView==="calendar"){
    // Stay on calendar but flip to board briefly for edit? Better: switch view to board and scroll.
    setView("board");
    // after render, editing flag is set; render already called by setView
  }else{
    render();
  }
}

function promptNewTimedTask(day, startMin){
  const title=(prompt("新任务标题：")||"").trim();
  if(!title) return;
  let tag="其他";
  const tags=tagNames();
  const raw=prompt("标签（"+tags.join("/")+"）：", tags[0]||"其他");
  if(raw!=null) tag=resolveTagInput(raw)||"其他";
  const endMin=Math.min(startMin+60, CAL_END_MIN);
  const st=hhmmOf(startMin), et=hhmmOf(endMin);
  addTask({
    title, tag, due: day, dueTime: st,
    startTime: st, endTime: et,
    bucket: suggestBucket({done:false,due:day,bucket:"later"}, today())
  });
  if(uiView==="calendar") renderCalendar();
}

function setupCalBlockDrag(block, task, day, layer){
  let mode=null; // move | resize
  let startY=0, origStart=0, origEnd=0, origDay=day;
  let curDay=day;
  let moved=false;

  const onDown=(e)=>{
    if(e.button!==undefined && e.button!==0) return;
    if(e.target.closest(".cal-check")) return;
    mode = e.target.closest(".resize") ? "resize" : "move";
    startY=e.clientY;
    origStart=minutesOf(task.startTime);
    origEnd=minutesOf(task.endTime);
    origDay=day; curDay=day;
    moved=false;
    calDrag={id:task.id, mode};
    block.classList.add(mode==="resize"?"resizing":"dragging");
    block.setPointerCapture(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  };
  const onMove=(e)=>{
    if(!calDrag || calDrag.id!==task.id) return;
    const dy=e.clientY-startY;
    if(Math.abs(dy)>3) moved=true;
    const dMin=snapMin(Math.round(dy / CAL_PX) * CAL_STEP, CAL_STEP);
    if(mode==="move"){
      let dur=origEnd-origStart;
      let ns=snapMin(origStart+dMin, CAL_STEP);
      ns=Math.max(CAL_START_MIN, Math.min(ns, CAL_END_MIN-CAL_STEP));
      let ne=ns+dur;
      if(ne>CAL_END_MIN){ ne=CAL_END_MIN; ns=ne-dur; if(ns<CAL_START_MIN) ns=CAL_START_MIN; }
      block.style.top=yOfMin(ns)+"px";
      block.style.height=Math.max(yOfMin(ne)-yOfMin(ns),18)+"px";
      block.dataset._ns=String(ns);
      block.dataset._ne=String(ne);
      // detect day under pointer
      const under=document.elementFromPoint(e.clientX, e.clientY);
      const slot=under && under.closest && under.closest(".cal-slot");
      const head=under && under.closest && under.closest(".cal-day-head");
      const allday=under && under.closest && under.closest("[data-allday]");
      const ov=under && under.closest && under.closest(".cal-day-overlay");
      if(slot) curDay=slot.dataset.day;
      else if(head) curDay=head.dataset.day;
      else if(allday) curDay=allday.dataset.allday;
      else if(ov) curDay=ov.dataset.day;
      block.dataset._day=curDay;
    }else{
      let ne=snapMin(origEnd+dMin, CAL_STEP);
      ne=Math.max(origStart+CAL_STEP, Math.min(ne, CAL_END_MIN));
      block.style.height=Math.max(yOfMin(ne)-yOfMin(origStart),18)+"px";
      block.dataset._ns=String(origStart);
      block.dataset._ne=String(ne);
      block.dataset._day=origDay;
    }
  };
  const onUp=async (e)=>{
    if(!calDrag || calDrag.id!==task.id) return;
    block.classList.remove("dragging","resizing");
    try{ block.releasePointerCapture(e.pointerId); }catch(_){}
    const ns=block.dataset._ns? +block.dataset._ns : null;
    const ne=block.dataset._ne? +block.dataset._ne : null;
    const nd=block.dataset._day || origDay;
    calDrag=null;
    if(!moved || ns==null || ne==null){ return; }
    await applyCalTimeMove(task.id, nd, hhmmOf(ns), hhmmOf(ne));
  };
  block.addEventListener("pointerdown", onDown);
  block.addEventListener("pointermove", onMove);
  block.addEventListener("pointerup", onUp);
  block.addEventListener("pointercancel", onUp);
}

async function applyCalTimeMove(id, newDue, newStart, newEnd){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  const oldDue=t.due||null;
  let k=null;
  if(oldDue && newDue && newDue!==oldDue){
    if(newDue>oldDue) k="later";
    else if(newDue<oldDue) k="earlier";
  }
  if(k==="later" && (t.postponeCount||0)>=4){
    const ok=await requestFriction(t, t.bucket, null);
    if(!ok){ render(); return; }
  }
  t.due=newDue;
  t.startTime=newStart;
  t.endTime=newEnd;
  t.dueTime=newStart; // keep dueTime aligned with slot start
  t.pinned=false;
  if(!t.done){
    t.bucket = state.autoBucket ? suggestBucket(t, today()) : (t.bucket||"later");
  }
  applyDueEdit(t, oldDue, newDue);
  touchTask(t);
  saveState();
  render();
  if(pendingPostponeModal && pendingPostponeModal._defer){
    const tt=state.tasks.find(x=>x.id===pendingPostponeModal.taskId);
    if(tt) showPostponeModal(tt, pendingPostponeModal.count);
    else pendingPostponeModal=null;
  }
}

function updateCalNowLine(){
  const grid=document.getElementById("calGrid");
  if(!grid) return;
  grid.querySelectorAll(".cal-now").forEach(n=>n.remove());
  const now=new Date();
  const ymd=fmtDate(now);
  const mins=now.getHours()*60+now.getMinutes();
  if(mins<CAL_START_MIN || mins>CAL_END_MIN) return;
  const days=calDays();
  if(!days.includes(ymd)) return;
  const di=days.indexOf(ymd);
  const overlay=grid.querySelector('.cal-day-overlay[data-day="'+ymd+'"]');
  const firstSlot=grid.querySelector('.cal-slot[data-day="'+ymd+'"][data-min="'+CAL_START_MIN+'"]');
  const target = overlay ? overlay.firstChild : firstSlot;
  if(!target) return;
  const line=document.createElement("div");
  line.className="cal-now";
  line.style.top=yOfMin(mins)+"px";
  if(overlay){
    overlay.firstChild.appendChild(line);
  }else{
    // fallback: absolute on slot column — skip
  }
}
function scrollCalToNow(){
  const scroll=document.getElementById("calScroll");
  if(!scroll) return;
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  const y=Math.max(0, yOfMin(mins)-80);
  scroll.scrollTop = y + 70; // account for sticky head approx
}


function render(){

function exportJSON(){
  const payload={
    ...serializeState(),
    exportedAt:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="winnie-tasks-backup-"+today()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  showToast("已导出备份文件");
}

function importJSON(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      let tasks=[];
      let tags=null;
      const snapTasks=state.tasks.map(t=>({...t}));
      const snapTags=cloneTags(state.tags);
      if(Array.isArray(data)){
        // maybe v1
        tasks=migrateFromV1(data) || data.map(normalizeTask);
        tags=mergeTagsFromTasks(defaultTags(), tasks);
      }else if(data && Array.isArray(data.tasks)){
        tasks=data.tasks.map(normalizeTask);
        if(typeof data.autoBucket==="boolean") state.autoBucket=data.autoBucket;
        tags=mergeTagsFromTasks(Array.isArray(data.tags)?data.tags:defaultTags(), tasks);
      }else throw new Error("格式不对");
      const snapTombs={...state.tombstones};
      state.tasks=tasks;
      state.tags=tags;
      if(data && data.tombstones) state.tombstones={...data.tombstones};
      ensure其他();
      saveState(); render();
      showToast("已导入 "+tasks.length+" 条任务", ()=>{
        state.tasks=snapTasks; state.tags=snapTags; state.tombstones=snapTombs; saveState(); render();
      });
    }catch(err){
      showToast("导入失败：请选择有效的 JSON 备份");
    }
  };
  reader.readAsText(file);
}

function updateVisibility(){
  const ready = hasToken() && bootReady && (syncState==="ok" || syncState==="offline" || syncState==="syncing" || syncState==="error");
  const showData = hasToken() && bootReady;
  const show = showData;
  document.getElementById("stats").classList.toggle("hidden", !show);
  document.getElementById("weekStrip").classList.toggle("hidden", !show);
  document.getElementById("tagFilters").classList.toggle("hidden", !show);
  document.getElementById("tagManageWrap").classList.toggle("hidden", !show);
  document.querySelector(".quick").classList.toggle("hidden", !show);
  const board=document.getElementById("board");
  const cal=document.getElementById("calWrap");
  if(board) board.classList.toggle("hidden", !show || uiView!=="board");
  if(cal){
    cal.classList.toggle("hidden", !show || uiView!=="calendar");
    cal.classList.toggle("show", show && uiView==="calendar");
  }
  const setup=document.getElementById("setupCard");
  const force = !hasToken();
  if(force) setup.classList.remove("hidden");
}
async function boot(){
  loadSyncCfg();
  fillSyncForm();
  loadState();
  fillTagDatalist();
  const quickTagEl=document.getElementById("quickTag");
  if(quickTagEl) quickTagEl.value="其他";
  if(!hasToken()){
    bootReady=false;
    setSyncUI("needsetup","粘贴 Token 后才能查看任务");
    updateVisibility();
    document.getElementById("setupCard").classList.remove("hidden");
    render(); // empty
    return;
  }
  setSyncUI("syncing","首次拉取");
  updateVisibility();
  const ok=await syncPull({preferLocalMerge:false});
  bootReady=true;
  updateVisibility();
  render();
  if(ok) setSyncUI("ok", syncDetail||"已就绪");
}
