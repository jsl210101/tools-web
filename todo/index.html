<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>任务清单 · tools</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#1a1d26;--muted:#6b7280;--line:#e5e7eb;
  --accent:#2563eb;--accent-soft:#eff6ff;--danger:#ef4444;--warn:#f59e0b;
  --overdue:#dc2626;--soon:#d97706;--ok:#059669;--star:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
.app{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.brand h1{margin:0;font-size:22px;font-weight:700}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
.toolbar input[type=search]:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--text)}
.btn:hover{background:#f9fafb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 8px;font-size:13px}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);user-select:none}
.quick{display:flex;gap:8px;margin-bottom:14px;background:var(--card);padding:10px;border-radius:var(--radius);box-shadow:var(--shadow)}
.quick input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
.quick input:focus{border-color:var(--accent)}
.quick select{min-width:88px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.bucket{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:180px;border:1px solid transparent;transition:border-color .15s,background .15s}
.bucket.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.bucket-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;gap:8px;position:sticky;top:0;background:inherit;border-radius:var(--radius) var(--radius) 0 0;z-index:1}
.bucket-hd h2{margin:0;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.count{background:#eef2ff;color:#3730a3;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
.bucket.done .count{background:#ecfdf5;color:#065f46}
.list{padding:0 8px 10px;min-height:60px;flex:1}
.task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 8px;cursor:grab;touch-action:none;position:relative;transition:box-shadow .15s,opacity .15s,transform .1s}
.task:active{cursor:grabbing}
.task.dragging{opacity:.45;transform:scale(.98)}
.task.important{border-left:3px solid var(--star)}
.task.overdue{border-color:#fecaca;background:#fff7f7}
.task.soon{border-color:#fde68a;background:#fffbeb}
.task.done-item{opacity:.72}
.task-row{display:flex;gap:8px;align-items:flex-start}
.check{appearance:none;width:18px;height:18px;margin-top:2px;border:2px solid #9ca3af;border-radius:50%;cursor:pointer;flex:0 0 auto;background:#fff;position:relative}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.body{flex:1;min-width:0}
.title{font-weight:550;word-break:break-word}
.title.struck{text-decoration:line-through;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;color:#fff}
.due{font-size:12px;color:var(--muted)}
.due.bad{color:var(--overdue);font-weight:600}
.due.warn{color:var(--soon);font-weight:600}
.weight{font-size:11px;background:#f3f4f6;color:#374151;padding:2px 6px;border-radius:6px}
.note{margin-top:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:2px;flex:0 0 auto}
.iconbtn{border:none;background:transparent;cursor:pointer;padding:4px;border-radius:6px;color:#9ca3af;line-height:1;font-size:16px}
.iconbtn:hover{background:#f3f4f6;color:#374151}
.iconbtn.star.on{color:var(--star)}
.handle{cursor:grab;color:#d1d5db;font-size:14px;padding:2px 4px;user-select:none}
.edit-panel{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:grid;gap:8px}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field textarea{min-height:56px;resize:vertical}
.edit-actions{display:flex;gap:8px;justify-content:flex-end}
.empty{color:var(--muted);font-size:13px;padding:18px 8px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:none;z-index:50;box-shadow:var(--shadow);max-width:90vw;align-items:center;gap:10px}
.toast.show{display:flex}
.toast button{border:none;background:#374151;color:#fff;border-radius:6px;padding:4px 8px;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:#bfdbfe;color:var(--accent);font-weight:600}
.stats{font-size:12px;color:var(--muted);margin-bottom:10px}
.collapse-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}

.sync-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sync-status{font-size:12px;padding:4px 10px;border-radius:999px;background:#eef2ff;color:#3730a3}
.sync-status.syncing{background:#fef3c7;color:#92400e}
.sync-status.offline{background:#fee2e2;color:#991b1b}
.sync-status.ok{background:#ecfdf5;color:#065f46}
.sync-status.needsetup{background:#f3f4f6;color:#4b5563}
.setup-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);max-width:560px;margin:24px auto}
.setup-card h2{margin:0 0 8px;font-size:18px}
.setup-card p{color:var(--muted);font-size:13px;margin:0 0 14px}
.setup-card .field{margin-bottom:10px}
.setup-card input{width:100%}
.board.hidden,.quick.hidden,.filters.hidden,.tag-manage-wrap.hidden,.stats.hidden,.week-strip.hidden,.cal-wrap.hidden{display:none !important}
.due .time{margin-left:4px}


.btn.danger{background:#fff;border-color:#fecaca;color:var(--danger)}
.btn.danger:hover{background:#fef2f2}
.filters{align-items:center}
.tag-manage-wrap{margin-bottom:12px}
.tag-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);margin-top:8px}
.tag-panel.hidden{display:none}
.tag-panel h3{margin:0 0 10px;font-size:14px}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tag-row:last-child{border-bottom:none}
.tag-row .swatch{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);padding:0;cursor:pointer;background:none}
.tag-row input[type=text]{flex:1;min-width:100px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tag-row input[type=color]{width:36px;height:28px;border:none;background:transparent;padding:0;cursor:pointer}
.tag-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tag-add input[type=text]{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tag-combo{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tag-combo input[list]{min-width:110px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.quick .tag-combo{flex:0 0 auto}


.badge-post{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:2px}
.badge-post.g1{background:#f3f4f6;color:#4b5563}
.badge-post.g2{background:#ffedd5;color:#c2410c}
.badge-post.g3{background:#fee2e2;color:#b91c1c}
.badge-comp{font-size:11px;padding:2px 7px;border-radius:999px;font-weight:650}
.badge-comp.early{background:#ecfdf5;color:#047857}
.badge-comp.ontime{background:#eff6ff;color:#1d4ed8}
.badge-comp.late{background:#fef2f2;color:#b91c1c}
.task.chronic{border-left:3px solid #ef4444 !important;box-shadow:inset 3px 0 0 rgba(239,68,68,.15)}
.week-strip{font-size:12px;color:var(--muted);margin:-2px 0 12px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;box-shadow:var(--shadow)}
.week-strip:hover{border-color:#bfdbfe;background:var(--accent-soft)}
.week-strip .nums{font-weight:650;color:var(--text)}
.week-detail{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none}
.week-strip.open .week-detail{display:block}
.week-detail li{margin:4px 0;font-size:12px}
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-mask.hidden{display:none}
.modal{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 12px;color:var(--muted);font-size:13px}
.modal .field{margin-bottom:10px}
.modal .field input[type=text],.modal .field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}
.confirm-later{display:flex;align-items:flex-start;gap:8px;font-size:13px;background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:8px;margin-bottom:10px}
@media (max-width:640px){
  .board{grid-template-columns:1fr}
  .app{padding:12px 10px 90px}
  .brand h1{font-size:20px}
}

/* View switch */
.view-switch{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin-right:4px}
.view-switch button{border:none;background:transparent;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.view-switch button.on{background:var(--accent);color:#fff;font-weight:600}
.view-switch button:not(.on):hover{background:#f3f4f6}

/* Calendar shell */
.cal-wrap{display:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.cal-wrap.show{display:block}
.cal-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.cal-toolbar .cal-title{font-weight:650;font-size:14px;flex:1;min-width:140px}
.cal-mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal-mode button{border:none;background:#fff;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.cal-mode button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cal-nav{display:flex;gap:4px;align-items:center}
.cal-scroll{overflow:auto;max-height:calc(100vh - 260px);position:relative;-webkit-overflow-scrolling:touch}
.cal-grid{display:grid;min-width:640px;position:relative}
.cal-grid.day-mode{min-width:280px}
.cal-head{display:contents}
.cal-corner{position:sticky;top:0;left:0;z-index:5;background:#f9fafb;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cal-day-head{position:sticky;top:0;z-index:4;background:#f9fafb;border-bottom:1px solid var(--line);padding:8px 4px;text-align:center;font-size:12px}
.cal-day-head .wd{color:var(--muted);font-size:11px}
.cal-day-head .dn{font-weight:700;font-size:16px;display:block;margin-top:2px}
.cal-day-head.today .dn{background:var(--accent);color:#fff;width:28px;height:28px;line-height:28px;border-radius:50%;margin:2px auto 0}
.cal-day-head.today{background:#eff6ff}
.cal-allday-row{display:contents}
.cal-allday-label{position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 4px;font-size:11px;color:var(--muted);text-align:right}
.cal-allday-cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-height:36px;padding:3px;background:#fafafa;display:flex;flex-direction:column;gap:2px}
.cal-chip{font-size:11px;padding:2px 6px;border-radius:6px;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.cal-chip.done{opacity:.55;text-decoration:line-through}
.cal-body{display:contents}
.cal-time-label{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid #f3f4f6;font-size:10px;color:var(--muted);text-align:right;padding:0 6px 0 2px;height:24px;line-height:24px;user-select:none}
.cal-slot{border-right:1px solid var(--line);border-bottom:1px solid #f3f4f6;height:24px;position:relative;cursor:pointer;background:#fff}
.cal-slot:nth-child(even), .cal-slot.half{background:#fcfcfd}
.cal-slot:hover{background:#eff6ff}
.cal-day-col{position:relative;border-right:1px solid var(--line);grid-row: var(--body-start) / var(--body-end); background:
  repeating-linear-gradient(to bottom, #fff 0, #fff 23px, #f3f4f6 23px, #f3f4f6 24px);}
.cal-day-cols-wrap{display:contents}
.cal-events-layer{position:relative;grid-column:2 / -1; grid-row: var(--body-start) / var(--body-end); pointer-events:none; z-index:1}
.cal-day-events{position:absolute; top:0; bottom:0; pointer-events:none}
.cal-block{position:absolute; border-radius:6px; padding:3px 6px; color:#fff; font-size:11px; overflow:hidden; cursor:grab; pointer-events:auto; box-shadow:0 1px 3px rgba(0,0,0,.15); z-index:2; min-height:18px; touch-action:none; user-select:none}
.cal-block:active{cursor:grabbing}
.cal-block.done{opacity:.55}
.cal-block .bt{font-weight:650; line-height:1.2; word-break:break-word}
.cal-block .bm{opacity:.9; font-size:10px; margin-top:1px}
.cal-block .resize{position:absolute; left:0; right:0; bottom:0; height:8px; cursor:ns-resize}
.cal-block.dragging, .cal-block.resizing{opacity:.85; z-index:10; box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cal-now{position:absolute; left:0; right:0; height:0; border-top:2px solid #ef4444; z-index:6; pointer-events:none}
.cal-now::before{content:""; position:absolute; left:-5px; top:-5px; width:10px; height:10px; background:#ef4444; border-radius:50%}
.cal-check{appearance:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.85);border-radius:50%;cursor:pointer;background:transparent;flex:0 0 auto;position:relative;margin-right:4px;vertical-align:middle}
.cal-check:checked{background:#fff}
.cal-check:checked::after{content:"";position:absolute;left:3px;top:0px;width:4px;height:7px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.time-row{display:flex;gap:8px;flex-wrap:wrap}
.time-row .field{flex:1;min-width:110px}
.board.hidden-view{display:none !important}
.cal-wrap.hidden-view{display:none !important}
@media (max-width:640px){
  .cal-scroll{max-height:calc(100vh - 220px)}
  .cal-grid{min-width:100%}
  .view-switch button{padding:7px 10px}
}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <h1>任务清单</h1>
      <p>私有数据经 GitHub 同步 · 本机可离线缓存 · 可导出备份</p>
    </div>
    <div class="toolbar">
      <div class="view-switch" role="tablist" aria-label="视图">
        <button type="button" id="viewBoard" class="on" role="tab" aria-selected="true">看板</button>
        <button type="button" id="viewCal" role="tab" aria-selected="false">日历</button>
      </div>
      <input type="search" id="search" placeholder="搜索标题 / 标签 / 备注" aria-label="搜索">
      <label class="switch"><input type="checkbox" id="autoBucket" checked> 按截止日期智能归组</label>
      <button class="btn sm" id="btnSyncNow" type="button" title="立即同步">↻ 同步</button>
      <button class="btn sm" id="btnSyncSettings" type="button">⚙ 同步设置</button>
      <button class="btn sm" id="btnExport" type="button">导出 JSON</button>
      <button class="btn sm" id="btnImport" type="button">导入 JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="sync-bar"><span class="sync-status needsetup" id="syncStatus">未配置</span><span id="syncDetail" style="font-size:12px;color:var(--muted)"></span></div>

  <div class="setup-card hidden" id="setupCard">
    <h2>连接私有数据仓库</h2>
    <p>页面是公开的，任务数据存在私有仓库。请粘贴只授权了 <code>tools-data</code> 的 GitHub Token（仅保存在本浏览器，不会上传到本页面仓库）。</p>
    <div class="field"><label>GitHub Token</label><input type="password" id="cfgToken" placeholder="粘贴 fine-grained PAT" autocomplete="off"></div>
    <div class="field"><label>Owner</label><input type="text" id="cfgOwner" value="jsl210101"></div>
    <div class="field"><label>Repo</label><input type="text" id="cfgRepo" value="tools-data"></div>
    <div class="field"><label>Path</label><input type="text" id="cfgPath" value="todo/tasks.json"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn primary" id="btnSaveSync">保存并同步</button>
      <button type="button" class="btn" id="btnClearSync">清除本机 Token</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="week-strip" id="weekStrip" title="点击展开本周延期最多的任务">加载中…</div>
  <div class="filters" id="tagFilters"></div>
  <div class="tag-manage-wrap" id="tagManageWrap">
    <button type="button" class="btn sm" id="btnTagManage">管理标签</button>
    <div class="tag-panel hidden" id="tagPanel" aria-live="polite">
      <h3>管理标签</h3>
      <div id="tagList"></div>
      <div class="tag-add">
        <input type="text" id="newTagName" placeholder="新标签名称" maxlength="24">
        <input type="color" id="newTagColor" value="#2563eb" title="颜色">
        <button type="button" class="btn sm primary" id="btnAddTag">添加标签</button>
      </div>
    </div>
  </div>

  <div class="quick">
    <input id="quickTitle" placeholder="添加任务，回车确认（可先选标签与日期）" autocomplete="off">
    <div class="tag-combo">
      <input id="quickTag" list="tagDatalist" placeholder="标签（可输入新建）" title="标签" autocomplete="off">
      <datalist id="tagDatalist"></datalist>
    </div>
    <input type="date" id="quickDue" title="截止日期">
    <input type="time" id="quickStart" title="开始时间" step="1800">
    <input type="time" id="quickEnd" title="结束时间" step="1800">
    <button class="btn primary" id="btnAdd" type="button">添加</button>
  </div>

  <div class="board" id="board"></div>

  <div class="cal-wrap" id="calWrap" aria-label="日历视图">
    <div class="cal-toolbar">
      <div class="cal-nav">
        <button type="button" class="btn sm" id="calPrev">‹ 上一周</button>
        <button type="button" class="btn sm" id="calToday">今天</button>
        <button type="button" class="btn sm" id="calNext">下一周 ›</button>
      </div>
      <div class="cal-title" id="calTitle">本周</div>
      <div class="cal-mode" role="group" aria-label="日历粒度">
        <button type="button" id="calModeWeek" class="on">周</button>
        <button type="button" id="calModeDay">日</button>
      </div>
    </div>
    <div class="cal-scroll" id="calScroll">
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
</div>


<div class="modal-mask hidden" id="postponeModal" role="dialog" aria-modal="true" aria-labelledby="postponeModalTitle">
  <div class="modal">
    <h3 id="postponeModalTitle">为什么又拖？</h3>
    <p>这是第 <strong id="postponeModalCount">3</strong> 次延期。写下原因（可选），或拆成更小的一步。</p>
    <div class="field"><label style="font-size:12px;color:var(--muted)">延期原因（可选）</label>
      <input type="text" id="postponeReason" placeholder="例如：材料还没齐 / 今天太满了" maxlength="120">
    </div>
    <div class="field"><label style="font-size:12px;color:var(--muted)">拆成更小一步（可选）</label>
      <input type="text" id="postponeSubtask" placeholder="例如：先列出大纲" maxlength="80">
    </div>
    <div class="actions">
      <button type="button" class="btn" id="postponeSkip">跳过</button>
      <button type="button" class="btn" id="postponeBreak">拆成更小一步</button>
      <button type="button" class="btn primary" id="postponeSave">记下原因</button>
    </div>
  </div>
</div>

<div class="modal-mask hidden" id="frictionModal" role="dialog" aria-modal="true" aria-labelledby="frictionModalTitle">
  <div class="modal">
    <h3 id="frictionModalTitle">再次延期确认</h3>
    <p>「<span id="frictionTitle"></span>」已延期 <strong id="frictionCount"></strong> 次。从第 5 次起需要确认后才能继续往后拖。</p>
    <label class="confirm-later"><input type="checkbox" id="frictionCheck"> 我知道我又在拖了</label>
    <div class="actions">
      <button type="button" class="btn" id="frictionCancel">取消</button>
      <button type="button" class="btn primary" id="frictionOk" disabled>确认延期</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button type="button" id="toastUndo">撤销</button></div>

<script>
(function(){
"use strict";

const KEY_V1 = "winnie-tasks-v1";
const KEY_V2 = "winnie-tasks-v2"; // local cache
const KEY_SYNC = "winnie-todo-sync-v1";
const KEY_VIEW = "winnie-todo-view-v1"; // board | calendar
const TODAY_STR = "2026-11-03"; // unused for public boot; kept for offline demos only

const BUCKETS = [
  {id:"today", name:"今天 · 我的一天", emoji:"☀"},
  {id:"tomorrow", name:"明天", emoji:"🌤"},
  {id:"week", name:"本周", emoji:"📅"},
  {id:"nextweek", name:"下周", emoji:"🗓"},
  {id:"later", name:"本月 / 以后", emoji:"📌"},
  {id:"done", name:"已完成", emoji:"✅"}
];

const DEFAULT_TAGS = [
  {name:"1007", color:"#2563eb"},
  {name:"2008", color:"#7c3aed"},
  {name:"2304", color:"#0891b2"},
  {name:"4002", color:"#db2777"},
  {name:"4104", color:"#ea580c"},
  {name:"科研", color:"#059669"},
  {name:"职业", color:"#4f46e5"},
  {name:"审稿", color:"#0f766e"},
  {name:"其他", color:"#6b7280"}
];
const DEFAULT_TAG_COLORS = Object.fromEntries(DEFAULT_TAGS.map(t=>[t.name,t.color]));
const FALLBACK_COLORS = ["#2563eb","#7c3aed","#0891b2","#db2777","#ea580c","#059669","#4f46e5","#0f766e","#ca8a04","#be123c","#4338ca","#0d9488"];

let state = {version:2, autoBucket:true, tasks:[], tags:[], tombstones:{}, filterTag:"", query:"", tagPanelOpen:false};
let syncCfg = {token:"", owner:"jsl210101", repo:"tools-data", path:"todo/tasks.json"};
let remoteSha = null;
let syncTimer = null;
let syncState = "needsetup"; // needsetup|ok|syncing|offline|error
let syncDetail = "";
let bootReady = false;
let undoStack = null;
let toastTimer = null;
let dragId = null;
let dragFrom = null;
let touchProxy = null;
let uiView = "board"; // board | calendar
let calAnchor = null; // YYYY-MM-DD of week Monday or day
let calMode = "week"; // week | day
let calNowTimer = null;
let calDrag = null; // {id, mode:'move'|'resize', startY, origStart, origEnd, day, colEl}

function uid(){return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

function nowMs(){return Date.now()}
function touchTask(t){ t.updatedAt = nowMs(); return t; }
function loadSyncCfg(){
  try{
    const raw=localStorage.getItem(KEY_SYNC);
    if(raw){
      const p=JSON.parse(raw);
      syncCfg = {
        token: p.token||"",
        owner: p.owner||"jsl210101",
        repo: p.repo||"tools-data",
        path: p.path||"todo/tasks.json"
      };
    }
  }catch(e){}
}
function saveSyncCfg(){
  localStorage.setItem(KEY_SYNC, JSON.stringify({
    token: syncCfg.token||"",
    owner: syncCfg.owner||"jsl210101",
    repo: syncCfg.repo||"tools-data",
    path: syncCfg.path||"todo/tasks.json"
  }));
}
function hasToken(){ return !!(syncCfg.token && syncCfg.token.trim()); }
function setSyncUI(status, detail){
  syncState=status; syncDetail=detail||"";
  const el=document.getElementById("syncStatus");
  const d=document.getElementById("syncDetail");
  if(!el) return;
  el.className="sync-status "+status;
  const map={needsetup:"未配置 Token", ok:"已同步", syncing:"同步中…", offline:"离线（用本地缓存）", error:"同步出错"};
  el.textContent=map[status]||status;
  if(d) d.textContent=syncDetail;
}
function b64ToUtf8(b64){
  const bin=atob(b64.replace(/\n/g,""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function utf8ToB64(str){
  const bytes=new TextEncoder().encode(str);
  let bin="";
  for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function apiHeaders(){
  return {
    "Authorization":"Bearer "+syncCfg.token.trim(),
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };
}
function contentsUrl(){
  return "https://api.github.com/repos/"+encodeURIComponent(syncCfg.owner)+"/"+encodeURIComponent(syncCfg.repo)+"/contents/"+syncCfg.path.split("/").map(encodeURIComponent).join("/");
}
function applyPayload(payload, {fromRemote}={}){
  state.autoBucket = payload.autoBucket !== false;
  state.tasks = (payload.tasks||[]).map(normalizeTask);
  state.tags = mergeTagsFromTasks(Array.isArray(payload.tags)?payload.tags:defaultTags(), state.tasks);
  state.tombstones = payload.tombstones && typeof payload.tombstones==="object" ? {...payload.tombstones} : {};
  // drop tasks that are tombstoned
  state.tasks = state.tasks.filter(t=>!state.tombstones[t.id]);
  ensure其他();
  cacheLocal();
}
function serializeState(){
  ensure其他();
  return {
    version:2,
    autoBucket: state.autoBucket,
    tags: cloneTags(state.tags),
    tasks: state.tasks.map(t=>{ const {editing,...rest}=t; return rest; }),
    tombstones: {...(state.tombstones||{})},
    savedAt: new Date().toISOString()
  };
}
function cacheLocal(){
  localStorage.setItem(KEY_V2, JSON.stringify(serializeState()));
}
function readLocalCache(){
  try{
    const raw=localStorage.getItem(KEY_V2);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function mergeStates(local, remote){
  // Prefer newer updatedAt per task id; honor union of tombstones; drop tombstoned
  const tombs={...(remote.tombstones||{}), ...(local.tombstones||{})};
  const map=new Map();
  const add=(list)=>{
    (list||[]).forEach(raw=>{
      const t=normalizeTask(raw);
      if(tombs[t.id]) return;
      const prev=map.get(t.id);
      if(!prev || (t.updatedAt||0) >= (prev.updatedAt||0)) map.set(t.id, t);
    });
  };
  // remote first then local so local newer wins via comparison
  add(remote.tasks); add(local.tasks);
  const tags=mergeTagsFromTasks([...(remote.tags||[]), ...(local.tags||[]), ...defaultTags()], [...map.values()]);
  return {
    version:2,
    autoBucket: local.autoBucket !== undefined ? local.autoBucket : remote.autoBucket !== false,
    tags,
    tasks: [...map.values()],
    tombstones: tombs,
    savedAt: new Date().toISOString()
  };
}
async function fetchRemote(){
  const res=await fetch(contentsUrl(), {headers: apiHeaders(), cache:"no-store"});
  if(res.status===404){
    remoteSha=null;
    return null;
  }
  if(!res.ok){
    const text=await res.text();
    throw new Error("HTTP "+res.status+" "+text.slice(0,180));
  }
  const data=await res.json();
  remoteSha=data.sha;
  const json=JSON.parse(b64ToUtf8(data.content));
  return json;
}
async function putRemote(payload, message){
  const body={
    message: message||("todo sync "+new Date().toISOString()),
    content: utf8ToB64(JSON.stringify(payload, null, 2)+"\n"),
    branch: "main"
  };
  if(remoteSha) body.sha=remoteSha;
  const res=await fetch(contentsUrl(), {
    method:"PUT",
    headers:{...apiHeaders(), "Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  if(res.status===409 || res.status===422){
    const err=new Error("SHA_CONFLICT");
    err.code="SHA_CONFLICT";
    err.http=res.status;
    throw err;
  }
  if(!res.ok){
    const text=await res.text();
    throw new Error("HTTP "+res.status+" "+text.slice(0,180));
  }
  const data=await res.json();
  remoteSha = data.content && data.content.sha ? data.content.sha : remoteSha;
  return data;
}
async function syncPull({preferLocalMerge}={}){
  if(!hasToken()){ setSyncUI("needsetup",""); return false; }
  setSyncUI("syncing","拉取中");
  try{
    const remote=await fetchRemote();
    if(!remote){
      // create from local if we have any
      const local=readLocalCache();
      if(local && (local.tasks||[]).length){
        applyPayload(local);
        await putRemote(serializeState(), "todo: initial upload");
        setSyncUI("ok","已创建远程文件");
        return true;
      }
      applyPayload({tasks:[], tags:defaultTags(), tombstones:{}, autoBucket:true});
      await putRemote(serializeState(), "todo: create empty");
      setSyncUI("ok","已创建空清单");
      return true;
    }
    if(preferLocalMerge){
      const local=readLocalCache()||serializeState();
      const merged=mergeStates(local, remote);
      applyPayload(merged);
    }else{
      applyPayload(remote);
    }
    setSyncUI("ok", "更新于 "+(remote.savedAt||"刚刚"));
    return true;
  }catch(e){
    const local=readLocalCache();
    if(local){
      applyPayload(local);
      setSyncUI("offline", String(e.message||e).slice(0,120));
      return false;
    }
    state.tasks=[]; state.tags=defaultTags(); state.tombstones={};
    setSyncUI("error", String(e.message||e).slice(0,120));
    return false;
  }
}
async function syncPush(){
  if(!hasToken() || !bootReady) return;
  setSyncUI("syncing","上传中");
  const payload=serializeState();
  cacheLocal();
  try{
    await putRemote(payload);
    setSyncUI("ok","刚才");
  }catch(e){
    if(e.code==="SHA_CONFLICT"){
      setSyncUI("syncing","冲突，合并重试");
      try{
        const remote=await fetchRemote();
        const merged=mergeStates(payload, remote||{tasks:[],tags:[],tombstones:{}});
        applyPayload(merged);
        await putRemote(serializeState(), "todo: merge after conflict");
        setSyncUI("ok","已合并冲突");
        render();
      }catch(e2){
        setSyncUI("error","冲突处理失败 "+String(e2.message||e2).slice(0,80));
      }
    }else{
      setSyncUI("offline", String(e.message||e).slice(0,120));
    }
  }
}
function scheduleSync(){
  cacheLocal();
  if(!hasToken() || !bootReady) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ syncPush(); }, 1500);
}
function tagNames(){return (state.tags||[]).map(t=>t.name);}
function ensure其他(){
  if(!(state.tags||[]).some(t=>t.name==="其他")){
    state.tags.push({name:"其他", color:DEFAULT_TAG_COLORS["其他"]||"#6b7280"});
  }
}
function nextDefaultColor(){
  const used=new Set((state.tags||[]).map(t=>t.color.toLowerCase()));
  for(const c of FALLBACK_COLORS){ if(!used.has(c.toLowerCase())) return c; }
  return FALLBACK_COLORS[(state.tags||[]).length % FALLBACK_COLORS.length];
}
function normalizeTagName(name){
  return String(name||"").trim().replace(/\s+/g," ").slice(0,24);
}
function ensureTag(name, color){
  const n=normalizeTagName(name);
  if(!n) return "其他";
  const existing=(state.tags||[]).find(t=>t.name===n);
  if(existing){
    if(color){ existing.color=color; saveState(); }
    return n;
  }
  state.tags.push({name:n, color:color||nextDefaultColor()});
  saveState();
  return n;
}
function mergeTagsFromTasks(baseTags, tasks){
  const map=new Map();
  (baseTags||[]).forEach(t=>{ if(t&&t.name) map.set(t.name, {name:t.name, color:t.color||DEFAULT_TAG_COLORS[t.name]||nextDefaultColor()}); });
  // Prefer default colors for known names when migrating old saves without tags array
  DEFAULT_TAGS.forEach(t=>{ if(!map.has(t.name)) map.set(t.name, {name:t.name, color:t.color}); });
  (tasks||[]).forEach(task=>{
    const n=normalizeTagName(task.tag||"其他")||"其他";
    if(!map.has(n)) map.set(n, {name:n, color:DEFAULT_TAG_COLORS[n]||nextDefaultColor()});
  });
  if(!map.has("其他")) map.set("其他", {name:"其他", color:DEFAULT_TAG_COLORS["其他"]});
  // stable-ish order: defaults first, then others alpha
  const defOrder=DEFAULT_TAGS.map(t=>t.name);
  const names=[...map.keys()];
  names.sort((a,b)=>{
    const ia=defOrder.indexOf(a), ib=defOrder.indexOf(b);
    if(ia>=0 && ib>=0) return ia-ib;
    if(ia>=0) return -1;
    if(ib>=0) return 1;
    return a.localeCompare(b,"zh");
  });
  return names.map(n=>map.get(n));
}
function addTag(name, color){
  const n=normalizeTagName(name);
  if(!n){ showToast("请输入标签名称"); return null; }
  if((state.tags||[]).some(t=>t.name===n)){ showToast("标签已存在："+n); return n; }
  state.tags.push({name:n, color:color||nextDefaultColor()});
  saveState(); render();
  showToast("已添加标签「"+n+"」");
  return n;
}
function renameTag(oldName, newName){
  const n=normalizeTagName(newName);
  if(!oldName) return false;
  if(oldName==="其他" && n!=="其他"){ showToast("「其他」是默认标签，不能改名"); return false; }
  if(!n){ showToast("名称不能为空"); return false; }
  if(n!==oldName && (state.tags||[]).some(t=>t.name===n)){ showToast("已有同名标签"); return false; }
  const tag=(state.tags||[]).find(t=>t.name===oldName);
  if(!tag) return false;
  tag.name=n;
  state.tasks.forEach(t=>{ if(t.tag===oldName){ t.tag=n; touchTask(t); } });
  if(state.filterTag===oldName) state.filterTag=n;
  saveState(); render();
  showToast("已重命名为「"+n+"」");
  return true;
}
function recolorTag(name, color){
  const tag=(state.tags||[]).find(t=>t.name===name);
  if(!tag || !color) return false;
  tag.color=color;
  saveState(); render();
  return true;
}
function deleteTag(name){
  if(name==="其他"){ showToast("「其他」不能删除"); return false; }
  const tag=(state.tags||[]).find(t=>t.name===name);
  if(!tag) return false;
  const count=state.tasks.filter(t=>t.tag===name).length;
  const msg = count
    ? ("确定删除标签「"+name+"」？将有 "+count+" 个任务改回「其他」。")
    : ("确定删除标签「"+name+"」？");
  if(!confirm(msg)) return false;
  state.tags = state.tags.filter(t=>t.name!==name);
  ensure其他();
  state.tasks.forEach(t=>{ if(t.tag===name){ t.tag="其他"; touchTask(t); } });
  if(state.filterTag===name) state.filterTag="";
  saveState(); render();
  showToast("已删除标签「"+name+"」");
  return true;
}


function cloneTags(list){return (list||[]).map(t=>({name:String(t.name), color:String(t.color||"#6b7280")}));}
function defaultTags(){return cloneTags(DEFAULT_TAGS);}
function tagColor(name){
  const t=(state.tags||[]).find(x=>x.name===name);
  if(t) return t.color;
  if(DEFAULT_TAG_COLORS[name]) return DEFAULT_TAG_COLORS[name];
  return DEFAULT_TAG_COLORS["其他"]||"#6b7280";
}
function today(){
  const d=new Date();
  return fmtDate(d);
}
function fmtDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function parseYMD(s){
  if(!s) return null;
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function addDays(ymd, n){
  const d=parseYMD(ymd); if(!d) return null;
  d.setDate(d.getDate()+n);
  return fmtDate(d);
}
function startOfWeek(ymd){ // Mon-start
  const d=parseYMD(ymd); if(!d) return null;
  const day=d.getDay(); // 0 Sun
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return fmtDate(d);
}
function endOfWeek(ymd){
  return addDays(startOfWeek(ymd), 6);
}
function startOfNextWeek(ymd){ return addDays(endOfWeek(ymd), 1); }
function endOfNextWeek(ymd){ return addDays(startOfNextWeek(ymd), 6); }
function daysBetween(a,b){
  const da=parseYMD(a), db=parseYMD(b);
  if(!da||!db) return null;
  return Math.round((db-da)/86400000);
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function suggestBucket(task, now){
  if(task.done) return "done";
  if(!task.due) return task.bucket && task.bucket!=="done" ? task.bucket : "later";
  const diff = daysBetween(now, task.due);
  if(diff===null) return "later";
  if(diff < 0) return "today"; // overdue stay visible in today
  if(diff === 0) return "today";
  if(diff === 1) return "tomorrow";
  const eow = endOfWeek(now);
  if(task.due <= eow) return "week";
  const enw = endOfNextWeek(now);
  if(task.due <= enw) return "nextweek";
  return "later";
}

function effectiveBucket(task, now){
  if(task.done) return "done";
  // Manual drag pins the bucket until due date is edited or auto is re-applied
  if(task.pinned) return task.bucket || "later";
  if(state.autoBucket && task.due) return suggestBucket(task, now);
  if(task.bucket==="done") return "later";
  return task.bucket || "later";
}
function endOfMonth(ymd){
  const d=parseYMD(ymd); if(!d) return null;
  const last=new Date(d.getFullYear(), d.getMonth()+1, 0);
  return fmtDate(last);
}
function dueForBucket(bucket, now){
  // Map a column drop to a concrete due date (keeps dueTime elsewhere).
  // Dates are chosen so suggestBucket() usually returns the same bucket.
  if(bucket==="today") return now;
  if(bucket==="tomorrow") return addDays(now, 1);
  if(bucket==="week"){
    let target=endOfWeek(now); // this Sunday (Mon-start week)
    const diff=daysBetween(now, target);
    // Sunday already in 今天/明天 → use day-after-tomorrow
    if(diff!==null && diff<=1) target=addDays(now, 2);
    return target;
  }
  if(bucket==="nextweek") return endOfNextWeek(now);
  if(bucket==="later"){
    let target=endOfMonth(now);
    const enw=endOfNextWeek(now);
    // Must sit after next week so smart-group keeps it in 本月/以后
    if(!target || target<=enw) target=addDays(enw, 1);
    return target;
  }
  return null;
}

function seedTasks(){
  // Intentionally empty: public page must not embed private task text.
  return [];
}


function normalizeHHMM(v){
  if(v==null || v==="") return null;
  const s=String(v).trim();
  let m=/^(\d{1,2}):(\d{2})$/.exec(s);
  if(!m) return null;
  let h=+m[1], mi=+m[2];
  if(h<0||h>23||mi<0||mi>59) return null;
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}
function minutesOf(hhmm){
  const n=normalizeHHMM(hhmm); if(!n) return null;
  const [h,m]=n.split(":").map(Number); return h*60+m;
}
function hhmmOf(mins){
  let m=((mins%1440)+1440)%1440;
  const h=Math.floor(m/60), mm=m%60;
  return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}
function snapMin(mins, step){
  step=step||30;
  return Math.round(mins/step)*step;
}
function hasTimeSlot(t){
  return !!(t && t.due && normalizeHHMM(t.startTime) && normalizeHHMM(t.endTime)
    && minutesOf(t.startTime) < minutesOf(t.endTime));
}

function normalizeTask(raw){
  const due = raw.due || null;
  const hist = Array.isArray(raw.moveHistory) ? raw.moveHistory.slice(-20).map(h=>({
    at: typeof h.at==="number" ? h.at : nowMs(),
    fromBucket: h.fromBucket || null,
    toBucket: h.toBucket || null,
    fromDue: h.fromDue || null,
    toDue: h.toDue || null,
    kind: h.kind==="later"||h.kind==="earlier"||h.kind==="done" ? h.kind : "later"
  })) : [];
  const reasons = Array.isArray(raw.postponeReasons) ? raw.postponeReasons.slice(-20).map(r=>({
    at: typeof r.at==="number" ? r.at : nowMs(),
    text: String(r.text||"").slice(0,120),
    count: typeof r.count==="number" ? r.count : null
  })) : [];
  return {
    id: raw.id || uid(),
    title: String(raw.title||raw.t||"").trim() || "未命名任务",
    done: !!(raw.done||raw.d),
    due: due,
    dueTime: raw.dueTime || null,
    startTime: normalizeHHMM(raw.startTime) || null,
    endTime: normalizeHHMM(raw.endTime) || null,
    note: raw.note || "",
    important: !!raw.important,
    tag: raw.tag || "其他",
    bucket: raw.bucket || "later",
    order: typeof raw.order==="number" ? raw.order : Date.now(),
    weight: raw.weight || null,
    pinned: !!raw.pinned,
    created: raw.created || Date.now(),
    completedAt: raw.completedAt || null,
    updatedAt: typeof raw.updatedAt==="number" ? raw.updatedAt : (raw.created || Date.now()),
    postponeCount: typeof raw.postponeCount==="number" ? Math.max(0, raw.postponeCount|0) : 0,
    moveHistory: hist,
    firstScheduledDue: raw.firstScheduledDue || due || null,
    completion: raw.completion==="early"||raw.completion==="onTime"||raw.completion==="late" ? raw.completion : null,
    postponeReasons: reasons,
    editing: false
  };
}

const BUCKET_RANK = {today:0, tomorrow:1, week:2, nextweek:3, later:4, done:5};

function ensureFirstScheduled(t){
  if(!t.firstScheduledDue && t.due) t.firstScheduledDue = t.due;
}

function classifyMoveKind(fromBucket, toBucket, fromDue, toDue){
  if(toBucket==="done") return "done";
  if(fromDue && toDue && toDue!==fromDue){
    if(toDue > fromDue) return "later";
    if(toDue < fromDue) return "earlier";
  }
  // no due change (or missing): fall back to column rank
  if(fromBucket && toBucket && fromBucket!==toBucket){
    const fo = BUCKET_RANK[fromBucket];
    const to = BUCKET_RANK[toBucket];
    if(typeof fo==="number" && typeof to==="number"){
      if(to > fo) return "later";
      if(to < fo) return "earlier";
    }
  }
  // due newly set from empty while staying / moving later column already handled
  if(!fromDue && toDue && fromBucket && toBucket){
    const fo = BUCKET_RANK[fromBucket], to = BUCKET_RANK[toBucket];
    if(typeof fo==="number" && typeof to==="number" && to > fo) return "later";
    return "earlier"; // first scheduling / earlier column → not a postpone
  }
  return null;
}

function recordMove(t, {fromBucket, toBucket, fromDue, toDue, kind}){
  ensureFirstScheduled(t);
  if(!kind) return 0;
  if(!Array.isArray(t.moveHistory)) t.moveHistory=[];
  t.moveHistory.push({
    at: nowMs(),
    fromBucket: fromBucket||null,
    toBucket: toBucket||null,
    fromDue: fromDue||null,
    toDue: toDue||null,
    kind
  });
  if(t.moveHistory.length>20) t.moveHistory=t.moveHistory.slice(-20);
  if(kind==="later"){
    t.postponeCount = (t.postponeCount||0) + 1;
    return t.postponeCount;
  }
  return t.postponeCount||0;
}

function classifyCompletion(t, completedAtMs){
  if(!t.due) return null;
  const when = new Date(completedAtMs || Date.now());
  const doneDay = fmtDate(when);
  if(doneDay < t.due) return "early";
  if(doneDay > t.due) return "late";
  if(t.dueTime){
    const m=/^(\d{1,2}):(\d{2})/.exec(t.dueTime);
    if(m){
      const dueDt=parseYMD(t.due);
      if(dueDt){
        dueDt.setHours(+m[1], +m[2], 0, 0);
        return when.getTime() <= dueDt.getTime() ? "onTime" : "late";
      }
    }
  }
  return "onTime";
}

function daysSinceFirstScheduled(t, now){
  if(!t.firstScheduledDue) return null;
  const base = t.firstScheduledDue;
  const cur = t.due || now;
  return daysBetween(base, cur);
}

function isChronic(t){
  if((t.postponeCount||0) < 3 || t.done) return false;
  const age = nowMs() - (t.updatedAt||0);
  return age >= 3*86400000;
}

function weekStartMs(nowYmd){
  const sow = startOfWeek(nowYmd); // Monday
  const d = parseYMD(sow);
  return d ? d.getTime() : 0;
}

function weekStats(now){
  const start = weekStartMs(now);
  const end = start + 7*86400000;
  let postponeN=0;
  const byTask={};
  state.tasks.forEach(t=>{
    (t.moveHistory||[]).forEach(h=>{
      if(h.kind!=="later") return;
      if(h.at>=start && h.at<end){
        postponeN++;
        byTask[t.id]=(byTask[t.id]||0)+1;
      }
    });
  });
  const completed = state.tasks.filter(t=>{
    if(!t.done || !t.completedAt) return false;
    return t.completedAt>=start && t.completedAt<end;
  });
  const early = completed.filter(t=>t.completion==="early").length;
  const onTimeish = completed.filter(t=>t.completion==="early"||t.completion==="onTime").length;
  const rate = completed.length ? Math.round(100*onTimeish/completed.length) : null;
  const top = Object.entries(byTask)
    .map(([id,n])=>{
      const t=state.tasks.find(x=>x.id===id);
      return t ? {id, n, title:t.title, postponeCount:t.postponeCount||0} : null;
    })
    .filter(Boolean)
    .sort((a,b)=>b.n-a.n || b.postponeCount-a.postponeCount)
    .slice(0,3);
  return {postponeN, early, rate, completedN: completed.length, top};
}

let pendingPostponeModal = null; // {taskId, count}

function finishPostponeModal({saveReason, doBreak}){
  const pend=pendingPostponeModal;

  const t=state.tasks.find(x=>x.id===pend.taskId);
  if(t){

      }

function requestFriction(task, toBucket, beforeId){

    document.getElementById("frictionCount").textContent=String(task.postponeCount||0);

    ck.checked=false;

    document.getElementById("frictionModal").classList.remove("hidden");
  });
}
function hideFriction(ok){

  document.getElementById("frictionModal").classList.add("hidden");

}

function applyMoveCore(id, toBucket, beforeId){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  const now=today();
  const fromBucket = t.done ? "done" : (t.bucket || effectiveBucket(t, now));
  const fromDue = t.due || null;
  let kind=null;
  if(toBucket==="done"){
    t.done=true;
    t.completedAt=t.completedAt||Date.now();
    t.completion = classifyCompletion(t, t.completedAt);
    t.bucket="done";
    t.pinned=false;
    kind="done";
    recordMove(t,{fromBucket,toBucket,fromDue,toDue:t.due,kind});
  }else{
    if(t.done){ t.done=false; t.completedAt=null; t.completion=null; }
    const newDue=dueForBucket(toBucket, now);
    const toDue = newDue || t.due || null;
    if(newDue) t.due=newDue; // keep existing dueTime
    t.bucket=toBucket;
    const suggested=suggestBucket({...t, done:false}, now);
    t.pinned = suggested!==toBucket;
    kind = classifyMoveKind(fromBucket, toBucket, fromDue, toDue);
    const newCount = recordMove(t,{fromBucket,toBucket,fromDue,toDue,kind});
    if(kind==="later" && newCount===3){
      // defer modal until after reorder/save
      pendingPostponeModal = {taskId:t.id, count:3, _defer:true};
    }
  }
  touchTask(t);

  const dest = state.tasks
    .filter(x=>x.id!==id && effectiveBucket(x,now)===toBucket)
    .sort((a,b)=>a.order-b.order);
  let orders=[];
  if(!beforeId){
    dest.forEach(x=>orders.push(x));
    orders.push(t);
  }else{
    let inserted=false;
    dest.forEach(x=>{
      if(x.id===beforeId){ orders.push(t); inserted=true; }
      orders.push(x);
    });
    if(!inserted) orders.push(t);
  }
  orders.forEach((x,i)=>{ x.order=i; touchTask(x); });
  saveState(); render();
  if(pendingPostponeModal && pendingPostponeModal._defer){
    const task=state.tasks.find(x=>x.id===pendingPostponeModal.taskId);
    if(task) showPostponeModal(task, 3);
    else pendingPostponeModal=null;
  }
}

async function moveTask(id, toBucket, beforeId){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  const now=today();
  const fromBucket = t.done ? "done" : (t.bucket || effectiveBucket(t, now));
  if(toBucket==="done"){
    applyMoveCore(id, toBucket, beforeId);
    return;
  }
  const fromDue = t.due || null;
  const newDue = dueForBucket(toBucket, now);
  const toDue = newDue || t.due || null;
  const kind = classifyMoveKind(fromBucket, toBucket, fromDue, toDue);
  // From 5th postpone on: current count >= 4 and this move would be later
  if(kind==="later" && (t.postponeCount||0) >= 4){
    const ok = await requestFriction(t, toBucket, beforeId);
    if(!ok){ render(); return; } // cancel → revert (never applied)
  }
  applyMoveCore(id, toBucket, beforeId);
}

function applyDueEdit(t, oldDue, newDue){
  ensureFirstScheduled(t);
  if((oldDue||null)===(newDue||null)) return;
  const kind = classifyMoveKind(t.bucket, t.bucket, oldDue, newDue);
  // due-only edit: if classify returned null because buckets same and dues differ, recompute
  let k = kind;
  if(!k && oldDue && newDue){
    if(newDue > oldDue) k="later";
    else if(newDue < oldDue) k="earlier";
  }
  if(!k && !oldDue && newDue) k="earlier"; // first set not a postpone
  const newCount = recordMove(t,{fromBucket:t.bucket,toBucket:t.bucket,fromDue:oldDue,toDue:newDue,kind:k});
  if(k==="later" && newCount===3){
    pendingPostponeModal={taskId:t.id,count:3,_defer:true};
  }
}

function tryParseDueFromTitle(title){
  // 11/5 or 11.5 or 11-5 → 2026-MM-DD
  let m = /(\d{1,2})[./-](\d{1,2})/.exec(title);
  if(m){
    const mm=String(+m[1]).padStart(2,"0");
    const dd=String(+m[2]).padStart(2,"0");
    return "2026-"+mm+"-"+dd;
  }
  return null;
}
function tryParseWeight(title){
  const m = /（?\(?(\d+(?:\.\d+)?%(?:\s*\+\s*\d+(?:\.\d+)?%)?)）?\)?/.exec(title);
  return m ? m[1].replace(/\s+/g,"") : null;
}
function guessTag(title, group){
  const codes=["1007","2008","2304","4002","4104"];
  for(const c of codes){ if(title.includes(c)) return c; }
  if(/审稿|Drive|百度网盘/.test(title)) return "审稿";
  if(/简历|职规|coffee chat|面试/.test(title)) return "职业";
  if(/超分子|实验|种子项目|文献|动物实验/.test(title)) return "科研";
  if(/考试|DDL/.test(group||"")) return "其他";
  return "其他";
}
function mapGroupToBucket(g){
  if(/今天|我的一天/.test(g)) return "today";
  if(/明天/.test(g)) return "tomorrow";
  if(/下周/.test(g)) return "nextweek";
  if(/本周/.test(g)) return "week";
  if(/完成|已完成/.test(g)) return "done";
  if(/考试|DDL|持续|以后|本月/.test(g)) return "later";
  return "later";
}

function migrateFromV1(raw){
  try{
    const data = typeof raw==="string" ? JSON.parse(raw) : raw;
    if(!Array.isArray(data)) return null;
    const tasks=[];
    let order=0;
    data.forEach(grp=>{
      const g = grp.g || grp.group || "";
      const items = grp.items || [];
      items.forEach(it=>{
        const title = it.t || it.title || "";
        const due = tryParseDueFromTitle(title);
        const weight = tryParseWeight(title);
        const bucket = it.d || it.done ? "done" : mapGroupToBucket(g);
        tasks.push(normalizeTask({
          title,
          done: !!(it.d||it.done),
          due,
          weight,
          tag: guessTag(title, g),
          bucket,
          order: order++,
          important: !!weight,
          completedAt: (it.d||it.done) ? Date.now() : null
        }));
      });
    });
    return tasks;
  }catch(e){ return null; }
}

}

function deleteTask(id){
  const idx=state.tasks.findIndex(t=>t.id===id);
  if(idx<0) return;
  const removed = state.tasks[idx];
  const snapshotTasks = state.tasks.map(t=>({...t}));
  const snapshotTombs = {...state.tombstones};
  state.tasks.splice(idx,1);
  state.tombstones[id] = nowMs();
  saveState(); render();
  showToast("已删除「"+removed.title.slice(0,20)+"」", ()=>{
    state.tasks = snapshotTasks;
    state.tombstones = snapshotTombs;
    saveState(); render();
  });
}

function toggleDone(id){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  const fromBucket = t.done ? "done" : (t.bucket || effectiveBucket(t, today()));
  t.done=!t.done;
  if(t.done){
    t.completedAt = Date.now();
    t.completion = classifyCompletion(t, t.completedAt);
    t.bucket="done";
    recordMove(t,{fromBucket,toBucket:"done",fromDue:t.due,toDue:t.due,kind:"done"});
  }else{
    t.completedAt = null;
    t.completion = null;
    if(t.bucket==="done") t.bucket = t.due ? suggestBucket({...t,done:false}, today()) : "later";
  }
  touchTask(t);
  saveState(); render();
}

function toggleStar(id){
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.important=!t.important;
  touchTask(t);
  saveState(); render();
}

function addTask(partial){
  const title=(partial.title||"").trim();
  if(!title) return;
  const task=normalizeTask({
    title,
    tag: partial.tag || "其他",
    due: partial.due || null,
    dueTime: partial.dueTime || null,
    startTime: partial.startTime || null,
    endTime: partial.endTime || null,
    note: partial.note || "",
    bucket: partial.bucket || (partial.due ? suggestBucket({done:false,due:partial.due,bucket:"later"}, today()) : "today"),
    weight: partial.weight || null,
    important: !!partial.important,
    order: Date.now(),
    firstScheduledDue: partial.due || null
  });
  ensureFirstScheduled(task);
  touchTask(task);
  state.tasks.unshift(task);
  // creating undoes tombstone if same id reused
  if(state.tombstones[task.id]) delete state.tombstones[task.id];
  saveState(); render();
}

function taskMatches(t){
  if(state.filterTag && t.tag!==state.filterTag) return false;
  const q=(state.query||"").trim().toLowerCase();
  if(!q) return true;
  return [t.title,t.note,t.tag,t.weight||""].join(" ").toLowerCase().includes(q);
}

function dueClass(task, now){
  if(!task.due || task.done) return "";
  const diff=daysBetween(now, task.due);
  if(diff===null) return "";
  if(diff<0) return "overdue";
  if(diff<=3) return "soon";
  return "";
}

function formatDueLabel(task, now){
  if(!task.due) return "";
  const diff=daysBetween(now, task.due);
  const d=parseYMD(task.due);
  const md=(d.getMonth()+1)+"/"+d.getDate();
  if(diff===null) return md;
  if(diff<0) return "逾期 "+(-diff)+" 天 · "+md;
  if(diff===0) return "今天截止 · "+md;
  if(diff===1) return "明天 · "+md;
  if(diff<=3) return diff+" 天后 · "+md;
  return md;
}
function formatDueTime(task){
  return task.dueTime ? (" "+task.dueTime) : "";
}

  const soon=open.filter(t=>{const d=t.due&&daysBetween(now,t.due); return d!==null && d>=0 && d<=3;}).length;
  const todayN=open.filter(t=>effectiveBucket(t,now)==="today").length;
  document.getElementById("stats").textContent=
    "进行中 "+open.length+" · 今天 "+todayN+" · 3 天内到期 "+soon+(overdue?(" · 已逾期 "+overdue):"")+" · 已完成 "+state.tasks.filter(t=>t.done).length;
  renderWeekStrip(now);

function renderTask(task, now){
  const el=document.createElement("div");
  const dc=dueClass(task, now);
  el.className="task"+(task.important?" important":"")+(dc?" "+dc:"")+(task.done?" done-item":"")+(isChronic(task)?" chronic":"");
  el.draggable=true;
  el.dataset.id=task.id;
  el.setAttribute("role","listitem");

  const dueLabel=formatDueLabel(task, now);
  const dueCls = dc==="overdue"?"bad":(dc==="soon"?"warn":"");
  const pc = task.postponeCount||0;
  let postBadge="";
  if(!task.done && pc>0){
    const g = pc>=3?"g3":(pc===2?"g2":"g1");
    const slip = daysSinceFirstScheduled(task, now);
    const tip = "已延期 "+pc+" 次"+(slip!==null ? (" · 距首次排期 "+slip+" 天") : "");
    postBadge='<span class="badge-post '+g+'" title="'+escapeHtml(tip)+'">⏳×'+pc+(pc>=3?" ⚠️":"")+'</span>';
  }
  let compBadge="";
  if(task.done && task.completion){
    if(task.completion==="early") compBadge='<span class="badge-comp early" title="提前完成">🌱 提前</span>';
    else if(task.completion==="onTime") compBadge='<span class="badge-comp ontime" title="准时完成">✓ 准时</span>';
    else if(task.completion==="late") compBadge='<span class="badge-comp late" title="超期完成">⏰ 超期</span>';
  }

  el.innerHTML=
    '<div class="task-row">'+
      '<span class="handle" title="拖拽" aria-hidden="true">⠿</span>'+
      '<input class="check" type="checkbox" '+(task.done?"checked":"")+' aria-label="完成">'+
      '<div class="body">'+
        '<div class="title'+(task.done?" struck":"")+'">'+escapeHtml(task.title)+'</div>'+
        '<div class="meta">'+
          '<span class="tag" style="background:'+tagColor(task.tag)+'">'+escapeHtml(task.tag)+'</span>'+
          (dueLabel?'<span class="due '+dueCls+'">'+escapeHtml(dueLabel)+escapeHtml(hasTimeSlot(task)?(' '+task.startTime+'–'+task.endTime):formatDueTime(task))+'</span>':'')+
          (task.weight?'<span class="weight">占比 '+escapeHtml(task.weight)+'</span>':'')+
          postBadge+compBadge+
        '</div>'+
        (task.note && !task.editing ? '<div class="note">'+escapeHtml(task.note)+'</div>' : '')+
      '</div>'+
      '<div class="actions">'+
        '<button type="button" class="iconbtn star'+(task.important?" on":"")+'" title="重要" data-act="star">'+(task.important?"★":"☆")+'</button>'+
        '<button type="button" class="iconbtn" title="编辑" data-act="edit">✎</button>'+
        '<button type="button" class="iconbtn" title="删除" data-act="del">×</button>'+
      '</div>'+
    '</div>';

  if(task.editing){
    const panel=document.createElement("div");
    panel.className="edit-panel";
    panel.innerHTML=
      '<div class="field"><label>标题</label><input data-f="title" value="'+escapeHtml(task.title)+'"></div>'+
      '<div class="field"><label>截止日期</label><input data-f="due" type="date" value="'+(task.due||"")+'"></div>'+
      '<div class="field"><label>截止时间（可选）</label><input data-f="dueTime" type="time" value="'+(task.dueTime||"")+'"></div>'+
      '<div class="time-row"><div class="field"><label>开始时间（日历时段）</label><input data-f="startTime" type="time" step="1800" value="'+(task.startTime||"")+'"></div>'+
      '<div class="field"><label>结束时间</label><input data-f="endTime" type="time" step="1800" value="'+(task.endTime||"")+'"></div></div>'+
      '<div class="field"><label>标签</label><div class="tag-combo"><select data-f="tag"></select></div></div>'+
      '<div class="field"><label>考试占比（可选）</label><input data-f="weight" placeholder="如 47.5%" value="'+escapeHtml(task.weight||"")+'"></div>'+
      '<div class="field"><label>备注</label><textarea data-f="note">'+escapeHtml(task.note||"")+'</textarea></div>'+
      '<div class="edit-actions"><button type="button" class="btn sm" data-act="cancel">取消</button><button type="button" class="btn sm primary" data-act="save">保存</button></div>';
    const tagSel=panel.querySelector('[data-f="tag"]');
    fillTagSelect(tagSel, task.tag);
    tagSel.addEventListener("change", ()=>{
      if(tagSel.value==="__new__"){
        const created=resolveTagInput("__new__");
        fillTagSelect(tagSel, created);
        fillTagDatalist();
      }
    });
    el.querySelector(".body").appendChild(panel);
  }

  // events
  el.querySelector(".check").addEventListener("change", ()=>toggleDone(task.id));
  el.querySelector('[data-act="star"]').addEventListener("click", e=>{e.stopPropagation(); toggleStar(task.id);});
  el.querySelector('[data-act="del"]').addEventListener("click", e=>{e.stopPropagation(); deleteTask(task.id);});
  el.querySelector('[data-act="edit"]').addEventListener("click", e=>{
    e.stopPropagation();
    state.tasks.forEach(x=>x.editing=false);
    task.editing=true; render();
  });
  el.querySelector(".title").addEventListener("dblclick", ()=>{
    state.tasks.forEach(x=>x.editing=false);
    task.editing=true; render();
  });

  if(task.editing){
    const panel=el.querySelector(".edit-panel");
    panel.querySelector('[data-act="cancel"]').onclick=()=>{task.editing=false; render();};
    panel.querySelector('[data-act="save"]').onclick=async ()=>{
      const oldDue=task.due||null;
      const newTitle=panel.querySelector('[data-f="title"]').value.trim()||task.title;
      const newDue=panel.querySelector('[data-f="due"]').value||null;
      const newDueTime=panel.querySelector('[data-f="dueTime"]').value||null;
      const newStart=normalizeHHMM(panel.querySelector('[data-f="startTime"]').value)||null;
      const newEnd=normalizeHHMM(panel.querySelector('[data-f="endTime"]').value)||null;
      const newTag=resolveTagInput(panel.querySelector('[data-f="tag"]').value)||"其他";
      const newWeight=panel.querySelector('[data-f="weight"]').value.trim()||null;
      const newNote=panel.querySelector('[data-f="note"]').value;
      let k=null;
      if((oldDue||null)!==(newDue||null)){
        if(oldDue && newDue){
          if(newDue>oldDue) k="later";
          else if(newDue<oldDue) k="earlier";
        } else if(!oldDue && newDue) k="earlier";
        else if(oldDue && !newDue) k="earlier";
      }
      if(k==="later" && (task.postponeCount||0)>=4){
        const ok=await requestFriction(task, task.bucket, null);
        if(!ok){ task.editing=false; render(); return; }
      }
      task.title=newTitle;
      task.due=newDue;
      task.dueTime=newDueTime;
      task.startTime=newStart;
      task.endTime=newEnd;
      task.tag=newTag;
      task.weight=newWeight;
      task.note=newNote;
      task.editing=false;
      task.pinned=false;
      applyDueEdit(task, oldDue, newDue);
      touchTask(task);
      if(state.autoBucket && task.due && !task.done){
        task.bucket=suggestBucket(task, today());
      } else if(!task.done){
        task.bucket = task.bucket==="done" ? "later" : (task.bucket || "later");
      }
      saveState(); render();
      if(pendingPostponeModal && pendingPostponeModal._defer){
        const tt=state.tasks.find(x=>x.id===pendingPostponeModal.taskId);
        if(tt) showPostponeModal(tt, pendingPostponeModal.count);
        else pendingPostponeModal=null;
      }
    };
  }

  // HTML5 drag
  el.addEventListener("dragstart", e=>{
    dragId=task.id;
    dragFrom=effectiveBucket(task, now);
    el.classList.add("dragging");
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("text/plain", task.id);
  });
  el.addEventListener("dragend", ()=>{
    el.classList.remove("dragging");
    dragId=null;
    document.querySelectorAll(".bucket.drag-over").forEach(b=>b.classList.remove("drag-over"));
  });
  el.addEventListener("dragover", e=>{
    e.preventDefault();
    e.dataTransfer.dropEffect="move";
  });
  el.addEventListener("drop", e=>{
    e.preventDefault();
    e.stopPropagation();
    const id=e.dataTransfer.getData("text/plain")||dragId;
    if(!id || id===task.id) return;
    const bucket=effectiveBucket(task, now);
    moveTask(id, bucket, task.id);
  });

  // Pointer / touch fallback (long-press drag via handle or whole card)
  setupPointerDrag(el, task);

  return el;
}

function setupPointerDrag(el, task){
  let tracking=false, startX=0, startY=0, clone=null, moved=false;
  const handle=el.querySelector(".handle");

  const onDown=(e)=>{
    if(e.button!==undefined && e.button!==0) return;
    if(e.target.closest("input,textarea,select,button,.edit-panel")) return;
    // require handle on mouse; allow whole card on touch
    const isTouch = e.pointerType==="touch" || e.pointerType==="pen";
    if(!isTouch && e.target!==handle && !handle.contains(e.target)) return;
    tracking=true; moved=false;
    startX=e.clientX; startY=e.clientY;
    el.setPointerCapture(e.pointerId);
  };
  const onMove=(e)=>{
    if(!tracking) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(!moved && Math.hypot(dx,dy)<8) return;
    if(!moved){
      moved=true;
      dragId=task.id;
      el.classList.add("dragging");
      clone=el.cloneNode(true);
      clone.style.position="fixed";
      clone.style.pointerEvents="none";
      clone.style.zIndex="100";
      clone.style.width=el.offsetWidth+"px";
      clone.style.opacity="0.9";
      clone.style.boxShadow="0 8px 24px rgba(0,0,0,.18)";
      document.body.appendChild(clone);
    }
    clone.style.left=(e.clientX-40)+"px";
    clone.style.top=(e.clientY-20)+"px";
    const under=document.elementFromPoint(e.clientX, e.clientY);
    document.querySelectorAll(".bucket.drag-over").forEach(b=>b.classList.remove("drag-over"));
    const bucket=under && under.closest(".bucket");
    if(bucket) bucket.classList.add("drag-over");
  };
  const onUp=(e)=>{
    if(!tracking) return;
    tracking=false;
    try{el.releasePointerCapture(e.pointerId);}catch(_){}
    if(clone){clone.remove(); clone=null;}
    el.classList.remove("dragging");
    const over=document.querySelector(".bucket.drag-over");
    document.querySelectorAll(".bucket.drag-over").forEach(b=>b.classList.remove("drag-over"));
    if(moved && over){
      const to=over.dataset.bucket;
      const under=document.elementFromPoint(e.clientX, e.clientY);
      const overTask=under && under.closest(".task");
      const beforeId = overTask && overTask.dataset.id !== task.id ? overTask.dataset.id : null;
      moveTask(task.id, to, beforeId);
    }
    dragId=null; moved=false;
  };
  el.addEventListener("pointerdown", onDown);
  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", onUp);
}

function renderBucket(bucket, now){
  const col=document.createElement("section");
  col.className="bucket"+(bucket.id==="done"?" done":"");
  col.dataset.bucket=bucket.id;

  const tasks=state.tasks
    .filter(t=>taskMatches(t) && effectiveBucket(t,now)===bucket.id)
    .sort((a,b)=>{
      if(!!a.important !== !!b.important) return a.important ? -1 : 1;
      if(a.due && b.due && a.due!==b.due) return a.due < b.due ? -1 : 1;
      if(a.due && !b.due) return -1;
      if(!a.due && b.due) return 1;
      return a.order - b.order;
    });

  const openCount=tasks.filter(t=>!t.done).length;
  const countLabel = bucket.id==="done" ? String(tasks.length) : (openCount+"/"+tasks.length);

  col.innerHTML=
    '<div class="bucket-hd"><h2><span>'+bucket.emoji+'</span> '+escapeHtml(bucket.name)+
    '</h2><span class="count">'+countLabel+'</span></div><div class="list" data-list="1"></div>';

  const list=col.querySelector(".list");
  if(!tasks.length){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent = bucket.id==="done" ? "完成任务会出现在这里" : "拖拽任务到这里，或在上方添加";
    list.appendChild(empty);
  }else if(bucket.id==="done"){
    const wrap=document.createElement("details");
    wrap.open = tasks.length <= 8;
    const sum=document.createElement("summary");
    sum.className="collapse-btn";
    sum.textContent="展开 / 收起已完成（"+tasks.length+"）";
    wrap.appendChild(sum);
    const inner=document.createElement("div");
    tasks.forEach(t=>inner.appendChild(renderTask(t, now)));
    wrap.appendChild(inner);
    list.appendChild(wrap);
  }else{
    tasks.forEach(t=>list.appendChild(renderTask(t, now)));
  }

  col.addEventListener("dragover", e=>{
    e.preventDefault();
    col.classList.add("drag-over");
    e.dataTransfer.dropEffect="move";
  });
  col.addEventListener("dragleave", e=>{
    if(!col.contains(e.relatedTarget)) col.classList.remove("drag-over");
  });
  col.addEventListener("drop", e=>{
    e.preventDefault();
    col.classList.remove("drag-over");
    const id=e.dataTransfer.getData("text/plain")||dragId;
    if(!id) return;
    // if dropped on empty area, append
    const targetTask=e.target.closest && e.target.closest(".task");
    if(targetTask && targetTask.dataset.id!==id) return; // handled by task drop
    moveTask(id, bucket.id, null);
  });

  return col;
}


/* ===== Calendar view (Outlook-style week/day) ===== */
const CAL_START_MIN = 7*60;   // 07:00
const CAL_END_MIN = 24*60;    // 24:00
const CAL_STEP = 30;
const CAL_PX = 24;            // px per 30 min

function loadViewPref(){
  try{
    const v=localStorage.getItem(KEY_VIEW);
    if(v==="calendar"||v==="board") uiView=v;
    const m=localStorage.getItem(KEY_VIEW+"-mode");
    if(m==="week"||m==="day") calMode=m;
  }catch(e){}
  if(!calAnchor) calAnchor = startOfWeek(today());
  // phone: default day mode if narrow and first visit without mode saved
  try{
    if(!localStorage.getItem(KEY_VIEW+"-mode") && window.matchMedia && window.matchMedia("(max-width:640px)").matches){
      calMode="day";
      calAnchor=today();
    }
  }catch(e){}
}
function saveViewPref(){
  try{
    localStorage.setItem(KEY_VIEW, uiView);
    localStorage.setItem(KEY_VIEW+"-mode", calMode);
  }catch(e){}
}
function setView(v){
  uiView = v==="calendar" ? "calendar" : "board";
  saveViewPref();
  const b=document.getElementById("viewBoard");
  const c=document.getElementById("viewCal");
  if(b){ b.classList.toggle("on", uiView==="board"); b.setAttribute("aria-selected", uiView==="board"?"true":"false"); }
  if(c){ c.classList.toggle("on", uiView==="calendar"); c.setAttribute("aria-selected", uiView==="calendar"?"true":"false"); }
  updateVisibility();
  render();
  if(uiView==="calendar"){
    setTimeout(scrollCalToNow, 30);
    startCalNowTimer();
  }else{
    stopCalNowTimer();
  }
}
function startCalNowTimer(){
  stopCalNowTimer();
  calNowTimer=setInterval(()=>{ if(uiView==="calendar") updateCalNowLine(); }, 60000);
}
function stopCalNowTimer(){ if(calNowTimer){ clearInterval(calNowTimer); calNowTimer=null; } }

function calDays(){
  if(calMode==="day"){
    if(!calAnchor) calAnchor=today();
    return [calAnchor];
  }
  const mon = startOfWeek(calAnchor || today());
  calAnchor = mon;
  const days=[];
  for(let i=0;i<7;i++) days.push(addDays(mon,i));
  return days;
}
function calTitleText(days){
  if(calMode==="day"){
    const d=parseYMD(days[0]);
    const w=["日","一","二","三","四","五","六"][d.getDay()];
    return (d.getMonth()+1)+"月"+d.getDate()+"日 周"+w;
  }
  const a=parseYMD(days[0]), b=parseYMD(days[6]);
  return a.getFullYear()+"年 "+(a.getMonth()+1)+"/"+a.getDate()+" – "+(b.getMonth()+1)+"/"+b.getDate();
}
function slotCount(){ return (CAL_END_MIN - CAL_START_MIN) / CAL_STEP; }
function yOfMin(mins){ return ((mins - CAL_START_MIN) / CAL_STEP) * CAL_PX; }
function minOfY(y){ return CAL_START_MIN + (y / CAL_PX) * CAL_STEP; }

function layoutOverlaps(events){
  // events: {id, startMin, endMin, task}
  const sorted=[...events].sort((a,b)=>a.startMin-b.startMin || b.endMin-a.endMin);
  const clusters=[];
  let cur=null;
  sorted.forEach(ev=>{
    if(!cur || ev.startMin >= cur.maxEnd){
      cur={items:[ev], maxEnd:ev.endMin};
      clusters.push(cur);
    }else{
      cur.items.push(ev);
      if(ev.endMin>cur.maxEnd) cur.maxEnd=ev.endMin;
    }
  });
  const out=[];
  clusters.forEach(cl=>{
    const cols=[];
    cl.items.forEach(ev=>{
      let placed=false;
      for(let i=0;i<cols.length;i++){
        const last=cols[i][cols[i].length-1];
        if(last.endMin <= ev.startMin){
          cols[i].push(ev); ev.col=i; placed=true; break;
        }
      }
      if(!placed){ ev.col=cols.length; cols.push([ev]); }
    });
    const n=cols.length;
    cl.items.forEach(ev=>{
      out.push({...ev, colCount:n, col:ev.col});
    });
  });
  return out;
}

function tasksForDay(day){
  return state.tasks.filter(t=>taskMatches(t) && t.due===day);
}
function timedForDay(day){
  return tasksForDay(day).filter(t=>hasTimeSlot(t)).map(t=>({
    id:t.id, task:t,
    startMin: minutesOf(t.startTime),
    endMin: minutesOf(t.endTime)
  }));
}
function alldayForDay(day){
  return tasksForDay(day).filter(t=>!hasTimeSlot(t));
}

function renderCalendar(){
  const wrap=document.getElementById("calWrap");
  const grid=document.getElementById("calGrid");
  if(!wrap||!grid) return;
  const days=calDays();
  document.getElementById("calTitle").textContent=calTitleText(days);
  document.getElementById("calModeWeek").classList.toggle("on", calMode==="week");
  document.getElementById("calModeDay").classList.toggle("on", calMode==="day");
  document.getElementById("calPrev").textContent = calMode==="day" ? "‹ 前一天" : "‹ 上一周";
  document.getElementById("calNext").textContent = calMode==="day" ? "后一天 ›" : "下一周 ›";

  const nSlots=slotCount();
  const nDays=days.length;
  const todayStr=today();
  // CSS grid: time col + days
  // rows: 1 head, 1 allday, then nSlots time rows
  // We'll use a structure: sticky heads + body with absolute event layers per day

  grid.className="cal-grid"+(calMode==="day"?" day-mode":"");
  grid.style.gridTemplateColumns = "52px repeat("+nDays+", minmax(0,1fr))";
  // Use a simpler DOM: head row, allday row, then a body area with time labels + day columns

  let html="";
  // Head
  html += '<div class="cal-corner" style="grid-column:1;grid-row:1"></div>';
  days.forEach((day,i)=>{
    const d=parseYMD(day);
    const w=["日","一","二","三","四","五","六"][d.getDay()];
    const isToday=day===todayStr;
    html += '<div class="cal-day-head'+(isToday?" today":"")+'" style="grid-column:'+(i+2)+';grid-row:1" data-day="'+day+'">'+
      '<span class="wd">周'+w+'</span><span class="dn">'+d.getDate()+'</span></div>';
  });
  // All-day
  html += '<div class="cal-allday-label" style="grid-column:1;grid-row:2">全天/DDL</div>';
  days.forEach((day,i)=>{
    html += '<div class="cal-allday-cell" style="grid-column:'+(i+2)+';grid-row:2" data-allday="'+day+'"></div>';
  });
  // Body: time labels + day columns as a tall area
  const bodyStart=3;
  const bodyEnd=bodyStart+nSlots;
  grid.style.setProperty("--body-start", String(bodyStart));
  grid.style.setProperty("--body-end", String(bodyEnd));
  for(let s=0;s<nSlots;s++){
    const mins=CAL_START_MIN + s*CAL_STEP;
    const label = (mins%60===0) ? hhmmOf(mins) : "";
    html += '<div class="cal-time-label" style="grid-column:1;grid-row:'+(bodyStart+s)+'">'+label+'</div>';
    days.forEach((day,i)=>{
      html += '<div class="cal-slot'+(mins%60===0?"":" half")+'" style="grid-column:'+(i+2)+';grid-row:'+(bodyStart+s)+'" data-day="'+day+'" data-min="'+mins+'"></div>';
    });
  }
  grid.innerHTML=html;

  // All-day chips
  days.forEach((day,i)=>{
    const cell=grid.querySelector('[data-allday="'+day+'"]');
    if(!cell) return;
    alldayForDay(day).forEach(t=>{
      const chip=document.createElement("div");
      chip.className="cal-chip"+(t.done?" done":"");
      chip.style.background=tagColor(t.tag);
      chip.title=t.title+(t.dueTime?(" · "+t.dueTime):"");
      chip.textContent=(t.dueTime?(t.dueTime+" "):"")+t.title;
      chip.onclick=(e)=>{ e.stopPropagation(); openTaskEdit(t.id); };
      cell.appendChild(chip);
    });
  });

  // Timed blocks — overlay per day column using absolute positioning relative to first slot of that day
  days.forEach((day, di)=>{
    const firstSlot=grid.querySelector('.cal-slot[data-day="'+day+'"][data-min="'+CAL_START_MIN+'"]');
    if(!firstSlot) return;
    // Create overlay positioned over the day's column slots
    const overlay=document.createElement("div");
    overlay.className="cal-day-overlay";
    overlay.dataset.day=day;
    overlay.style.cssText="position:relative;grid-column:"+(di+2)+";grid-row:"+bodyStart+" / "+bodyEnd+";pointer-events:none;z-index:2;";
    // Absolute container filling the area
    const layer=document.createElement("div");
    layer.style.cssText="position:absolute;inset:0;pointer-events:none;";
    overlay.appendChild(layer);
    grid.appendChild(overlay);

    const laid=layoutOverlaps(timedForDay(day).map(ev=>{
      // clamp to visible range
      let sm=Math.max(ev.startMin, CAL_START_MIN);
      let em=Math.min(ev.endMin, CAL_END_MIN);
      if(em<=sm) em=sm+CAL_STEP;
      return {...ev, startMin:sm, endMin:em};
    }));
    laid.forEach(ev=>{
      const t=ev.task;
      const top=yOfMin(ev.startMin);
      const height=Math.max(yOfMin(ev.endMin)-top, 18);
      const widthPct=100/ev.colCount;
      const leftPct=ev.col*widthPct;
      const block=document.createElement("div");
      block.className="cal-block"+(t.done?" done":"");
      block.dataset.id=t.id;
      block.style.top=top+"px";
      block.style.height=height+"px";
      block.style.left="calc("+leftPct+"% + 1px)";
      block.style.width="calc("+widthPct+"% - 3px)";
      block.style.background=tagColor(t.tag);
      block.innerHTML=
        '<div style="display:flex;align-items:flex-start;gap:2px">'+
          '<input class="cal-check" type="checkbox" '+(t.done?"checked":"")+' title="完成" aria-label="完成">'+
          '<div style="min-width:0;flex:1">'+
            '<div class="bt">'+escapeHtml(t.title)+'</div>'+
            '<div class="bm">'+escapeHtml(t.startTime)+"–"+escapeHtml(t.endTime)+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="resize" title="拖底边调整时长"></div>';
      block.querySelector(".cal-check").addEventListener("click", e=>{ e.stopPropagation(); toggleDone(t.id); });
      block.addEventListener("click", e=>{
        if(e.target.closest(".cal-check,.resize")) return;
        if(calDrag) return;
        openTaskEdit(t.id);
      });
      setupCalBlockDrag(block, t, day, layer);
      layer.appendChild(block);
    });
  });

  // Click empty slot → create
  grid.querySelectorAll(".cal-slot").forEach(slot=>{
    slot.addEventListener("click", ()=>{
      const day=slot.dataset.day;
      const min=+slot.dataset.min;
      promptNewTimedTask(day, min);
    });
  });

  updateCalNowLine();
}

function openTaskEdit(id){
  state.tasks.forEach(x=>x.editing=false);
  const t=state.tasks.find(x=>x.id===id);
  if(!t) return;
